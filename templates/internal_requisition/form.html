{% extends base_template|default:'base.html' %}
{% block page_title %}New Internal Requisition{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header d-flex align-items-center gap-2">
                <i class="bi bi-plus-circle" style="color:#16a34a;"></i> New Internal Requisition
            </div>
            <div class="card-body">
                <form method="POST" id="reqForm">
                    {% csrf_token %}

                    <h6 class="fw-bold mb-3" style="color:#16a34a;"><i class="bi bi-person me-1"></i> Personal Information</h6>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Email Address <span class="text-danger">*</span></label>
                            <input type="email" name="email_address" class="form-control" value="{{ request.user.email|default:'' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" name="full_name" class="form-control" value="{{ request.user.get_full_name|default:'' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
                            <input type="text" name="mobile_number" class="form-control" placeholder="e.g. 017XX-XXXXXX" required>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label">Designation <span class="text-danger">*</span></label>
                            <input type="text" name="designation" class="form-control" placeholder="e.g. Software Engineer" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">PIN <span class="text-danger">*</span></label>
                            <input type="text" name="pin" class="form-control" placeholder="Staff PIN number" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Department <span class="text-danger">*</span></label>
                            <input type="text" name="department" class="form-control" placeholder="e.g. Finance, HR, Operations" required>
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold mb-0">Equipment Items</h6>
                        <button type="button" class="btn btn-sm btn-outline-success" id="addRow">
                            <i class="bi bi-plus-lg me-1"></i> Add Item
                        </button>
                    </div>

                    <div id="itemsContainer">
                        <div class="row item-row g-2 mb-2">
                            <div class="col-4">
                                <input type="text" name="eq_name[]" class="form-control form-control-sm" placeholder="Equipment name" required>
                            </div>
                            <div class="col-2">
                                <input type="number" name="eq_quantity[]" class="form-control form-control-sm" placeholder="Qty" value="1" min="1" required>
                            </div>
                            <div class="col-5">
                                <input type="text" name="eq_purpose[]" class="form-control form-control-sm" placeholder="Purpose / reason">
                            </div>
                            <div class="col-1 d-flex align-items-center">
                                <button type="button" class="btn btn-sm btn-outline-danger remove-row" title="Remove">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send me-1"></i> Submit Request
                        </button>
                        <a href="{% if user.is_authenticated %}{% url 'internal_requisition:list' %}{% else %}{% url 'home' %}{% endif %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x me-1"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('itemsContainer');

    document.getElementById('addRow').addEventListener('click', function() {
        const row = container.querySelector('.item-row').cloneNode(true);
        row.querySelectorAll('input').forEach(inp => inp.value = '');
        row.querySelector('input[name="eq_quantity[]"]').value = '1';
        container.appendChild(row);
    });

    container.addEventListener('click', function(e) {
        if (e.target.closest('.remove-row')) {
            const rows = container.querySelectorAll('.item-row');
            if (rows.length > 1) {
                e.target.closest('.item-row').remove();
            }
        }
    });
});
</script>
{% endblock %}
