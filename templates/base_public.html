<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Requisition Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .public-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .public-header .brand {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .public-header a { color: #fff; text-decoration: none; }
        .content { padding: 24px; max-width: 1200px; margin: 0 auto; }
        .alert-dismissible .btn-close { filter: none; }
    </style>
</head>
<body>
    <div class="public-header">
        <a href="{% url 'home' %}" class="brand">
            <i class="bi bi-building me-2"></i>Requisition Portal
        </a>
        <a href="{% url 'login' %}" class="btn btn-sm btn-light">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </a>
    </div>
    <div class="content">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show py-2 small" role="alert">
                    <i class="bi bi-check-circle me-1"></i> {{ message }}
                    <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
