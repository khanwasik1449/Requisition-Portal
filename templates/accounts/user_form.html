{% extends 'base.html' %}
{% block page_title %}{% if edit_user %}Edit User{% else %}Add User{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header d-flex align-items-center gap-2">
                <i class="bi bi-{% if edit_user %}pencil{% else %}person-plus{% endif %}" style="color:#2563eb;"></i>
                {% if edit_user %}Edit User{% else %}Add New User{% endif %}
            </div>
            <div class="card-body">
                {% if error %}
                    <div class="alert alert-danger py-2 small">{{ error }}</div>
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" value="{{ edit_user.username|default:'' }}" {% if edit_user %}readonly{% endif %} required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ edit_user.email|default:'' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ edit_user.phone|default:'' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role <span class="text-danger">*</span></label>
                        <select name="role" class="form-select">
                            <option value="requester" {% if edit_user and edit_user.role == 'requester' %}selected{% endif %}>Requester</option>
                            <option value="supervisor" {% if edit_user and edit_user.role == 'supervisor' %}selected{% endif %}>Supervisor (1st Approver)</option>
                            <option value="ict_approver" {% if edit_user and edit_user.role == 'ict_approver' %}selected{% endif %}>ICT Approver (2nd Approver)</option>
                            <option value="ict_admin" {% if edit_user and edit_user.role == 'ict_admin' %}selected{% endif %}>ICT Admin</option>
                            <option value="transport_admin" {% if edit_user and edit_user.role == 'transport_admin' %}selected{% endif %}>Transport Admin</option>
                            <option value="internal_admin" {% if edit_user and edit_user.role == 'internal_admin' %}selected{% endif %}>Internal Admin</option>
                            <option value="admin" {% if edit_user and edit_user.role == 'admin' %}selected{% endif %}>Admin</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password {% if not edit_user %}<span class="text-danger">*</span>{% endif %}</label>
                        <input type="password" name="password" class="form-control" placeholder="{% if edit_user %}Leave blank to keep current{% else %}Set password{% endif %}" {% if not edit_user %}required{% endif %}>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if not edit_user or edit_user.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Active (can log in)</label>
                    </div>
                    <hr>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i> {% if edit_user %}Save Changes{% else %}Create User{% endif %}
                        </button>
                        <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x me-1"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
