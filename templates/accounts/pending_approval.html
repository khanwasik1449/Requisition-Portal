<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Approval — BRAC IED Central Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,.3);
            padding: 48px;
            width: 460px;
            max-width: 100%;
            background: #fff;
            text-align: center;
        }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        h3 { font-weight: 700; color: #0f172a; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⏳</div>
        <h3>Account Pending Approval</h3>
        <p class="text-muted mt-3">Your account has been created and is awaiting approval by an administrator. You will be notified once your account is activated.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-3 px-4">Back to Login</a>
    </div>
</body>
</html>
