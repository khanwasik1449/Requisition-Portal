<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — BRAC IED Central Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,.3);
            padding: 40px;
            width: 480px;
            max-width: 100%;
            background: #fff;
        }
        .brand-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .brand-icon img {
            height: auto;
            max-height: 56px;
            width: auto;
        }
            margin: 0 auto 16px;
        }
        h3 { font-weight: 700; color: #0f172a; }
        .form-control, .form-select {
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            padding: 11px 14px;
            font-size: .875rem;
            transition: all .15s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }
        .form-label { font-weight: 600; font-size: .8rem; color: #0f172a; }
        .btn-primary {
            background: #2563eb;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
        .divider { border-top: 1px solid #e2e8f0; margin: 24px 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <img src="http://bracied.com/wp-content/uploads/2025/10/BRAC-IED-Color_PNG.png" alt="BRAC IED" style="width:100%; height:100%; object-fit:contain;">
            </div>
            <h3>Create Account</h3>
            <p class="text-muted small">Register for a new account</p>
        </div>
        {% if error %}
            <div class="alert alert-danger py-2 small"><i class="bi bi-exclamation-circle me-1"></i> {{ error }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Username <span class="text-danger">*</span></label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="your@email.com">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" placeholder="+254 7XX XXX XXX">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Role</label>
                    <input type="text" class="form-control" value="Requester" disabled>
                    <input type="hidden" name="role" value="requester">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="password" name="password1" class="form-control" placeholder="Create a password" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <input type="password" name="password2" class="form-control" placeholder="Confirm password" required>
                </div>
            </div>
            <div class="alert alert-info py-2 small">
                <i class="bi bi-info-circle me-1"></i> After registration, an administrator must approve your account before you can log in.
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-person-plus me-1"></i> Create Account
            </button>
        </form>
        <div class="divider"></div>
        <p class="text-center mb-0 text-muted small">
            Already have an account? <a href="{% url 'login' %}" class="fw-semibold">Sign In</a>
        </p>
    </div>
</body>
</html>
