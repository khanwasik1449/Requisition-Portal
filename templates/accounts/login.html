<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BRAC IED Central Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,.3);
            padding: 40px;
            width: 420px;
            max-width: 100%;
            background: #fff;
        }
        .brand-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .brand-icon img {
            height: auto;
            max-height: 56px;
            width: auto;
        }
            margin: 0 auto 16px;
        }
        h3 { font-weight: 700; color: #0f172a; }
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            padding: 12px 14px;
            font-size: .875rem;
            transition: all .15s ease;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }
        .form-label { font-weight: 600; font-size: .8rem; color: #0f172a; }
        .btn-primary {
            background: #2563eb;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
        .divider { border-top: 1px solid #e2e8f0; margin: 24px 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <img src="http://bracied.com/wp-content/uploads/2025/10/BRAC-IED-Color_PNG.png" alt="BRAC IED" style="width:100%; height:100%; object-fit:contain;">
            </div>
            <h3>Welcome Back</h3>
            <p class="text-muted small">Sign in to your account</p>
        </div>
        {% if form.errors %}
            <div class="alert alert-danger py-2 small"><i class="bi bi-exclamation-circle me-1"></i> Invalid username or password.</div>
        {% endif %}
        {% if inactive_error %}
            <div class="alert alert-warning py-2 small"><i class="bi bi-clock me-1"></i> {{ inactive_error }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-2"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-2"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>
        <div class="divider"></div>
        <p class="text-center mb-0 text-muted small">
            Don't have an account? <a href="{% url 'signup' %}" class="fw-semibold">Sign Up</a>
        </p>
    </div>
</body>
</html>
