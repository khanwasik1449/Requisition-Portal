<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payslip Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container { max-width: 500px; }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 40px 32px;
            background: #fff;
        }
        .card h3 { font-weight: 700; color: #1e293b; }
        .card p { color: #64748b; font-size: .9rem; }
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            padding: 12px 14px;
            font-size: .9rem;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,.12);
        }
        .form-label { font-weight: 600; font-size: .85rem; color: #1e293b; }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(102,126,234,.3); }
        .back-link { color: #000; text-decoration: none; font-size: .85rem; }
        .back-link:hover { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link mb-3 d-inline-block">&larr; Back to Home</a>
        <div class="card">
            <div class="text-center mb-1" style="font-size:2.5rem;">💰</div>
            <h3 class="text-center">Payslip Request</h3>
            <p class="text-center mb-4">Submit your details to request a payslip</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success py-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" onsubmit="document.getElementById('monthsHidden').value = Array.from(document.querySelectorAll('input[name=selected_months]:checked')).map(c=>c.value).join(', '); return true;">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">PIN</label>
                    <input type="text" name="pin" class="form-control" placeholder="e.g. EMP-2024-001" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Months <small class="text-muted">(select one or more)</small></label>
                    <div class="row g-2" style="max-height:200px;overflow-y:auto;">
                        {% for m in months %}
                        <div class="col-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="selected_months" value="{{ m }}" id="month_{{ forloop.counter }}">
                                <label class="form-check-label" for="month_{{ forloop.counter }}">{{ m }}</label>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    <input type="hidden" name="months" id="monthsHidden">
                </div>
                <div class="mb-4">
                    <label class="form-label">Year</label>
                    <select name="year" class="form-select" required>
                        {% for y in years %}
                        <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Submit Request</button>
            </form>
        </div>
    </div>
</body>
</html>
