{% extends 'base.html' %}
{% block page_title %}Post Announcement — MeetSpace{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header"><i class="bi bi-megaphone me-1"></i> Post an announcement</div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea name="message" rows="4" class="form-control"
                                  placeholder="What should everyone know?"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Attachment <span class="text-muted">(optional)</span></label>
                        <input type="file" name="attachment" class="form-control">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i> Post
                        </button>
                        <a href="{% url 'meetspace:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
