<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HR Contract System</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #F7F6F3;
    --surface:      #FFFFFF;
    --surface2:     #F7F6F3;
    --border:       rgba(0,0,0,0.08);
    --border-strong:rgba(0,0,0,0.15);
    --text:         #1A1917;
    --muted:        #6B6A66;
    --hint:         #A8A79F;
    --accent:       #2563EB;
    --accent-light: #EFF4FF;
    --accent-bdr:   rgba(37,99,235,0.3);
    --success:      #16A34A;
    --success-light:#F0FDF4;
    --danger:       #DC2626;
    --danger-light: #FEF2F2;
    --shadow:       0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:    0 4px 16px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
    --radius:       12px;
    --radius-sm:    8px;
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
  }

  /* ── Card ── */
  .card-wrap {
    width: 100%; max-width: 420px;
    animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }

  /* ── Card body ── */
  .card-body { padding: 1.75rem 1.75rem 1.5rem; }

  /* ── Brand header ── */
  .brand {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 1.5rem;
  }
  .brand-icon {
    width: 40px; height: 40px;
    background: var(--accent-light);
    border: 1px solid var(--accent-bdr);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-size: 16px; font-weight: 600;
    color: var(--text); letter-spacing: -0.01em; line-height: 1.2;
  }
  .brand-text p {
    font-size: 12px; color: var(--hint);
    margin-top: 1px;
  }

  /* ── Divider ── */
  .divider { height: 1px; background: var(--border); margin-bottom: 1.5rem; }

  /* ── Section label — same as form ── */
  .section-label {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--hint); margin-bottom: 1.25rem;
  }

  /* ── Error box ── */
  .error-box {
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--danger-light);
    border: 1px solid rgba(220,38,38,0.15);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 13px; color: var(--danger);
    margin-bottom: 1.25rem;
    animation: shake 0.35s ease;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  /* ── Fields — identical to form ── */
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 1rem; }
  .field label {
    font-size: 13px; font-weight: 500; color: var(--muted);
  }
  .input-wrap { position: relative; }
  .input-icon {
    position: absolute; left: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--hint); pointer-events: none;
    transition: color 0.2s;
  }
  .field input {
    width: 100%; height: 40px;
    padding: 0 40px 0 36px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 14px; font-family: 'DM Sans', sans-serif;
    color: var(--text); background: var(--surface2);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .field input::placeholder { color: var(--hint); }
  .field input:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .field input:focus ~ .input-icon { color: var(--accent); }
  .field input.err {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(220,38,38,0.08);
  }

  .field-hint {
    font-size: 11px; color: var(--danger); display: none; margin-top: 2px;
  }
  .field-hint.visible { display: block; }

  /* ── Password toggle ── */
  .toggle-pw {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--hint); padding: 4px;
    display: flex; align-items: center;
    transition: color 0.15s; line-height: 0;
  }
  .toggle-pw:hover { color: var(--muted); }

  /* ── Caps lock ── */
  .capslock {
    display: none; align-items: center; gap: 5px;
    font-size: 11px; color: var(--muted);
    margin-top: 2px;
  }
  .capslock.show { display: flex; }

  /* ── Remember row ── */
  .options-row { margin-bottom: 1.25rem; }
  .check-label {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
    font-size: 13px; color: var(--muted);
  }
  .check-label input[type=checkbox] {
    position: absolute; opacity: 0; width: 0; height: 0;
  }
  .custom-check {
    width: 16px; height: 16px;
    border: 1.5px solid var(--border-strong); border-radius: 4px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; position: relative;
  }
  .check-label input[type=checkbox]:checked + .custom-check {
    background: var(--accent); border-color: var(--accent);
  }
  .check-label input[type=checkbox]:checked + .custom-check::after {
    content: '';
    width: 8px; height: 5px;
    border-left: 1.5px solid #fff;
    border-bottom: 1.5px solid #fff;
    transform: rotate(-45deg) translateY(-1px);
    display: block;
  }

  /* ── Nav row — same as form ── */
  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.1rem 1.75rem;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .nav-info {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--hint);
  }

  /* ── Submit button — same as form .btn-primary ── */
  .btn-submit {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 20px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
    transition: all 0.18s;
    position: relative; overflow: hidden;
  }
  .btn-submit:hover:not(:disabled) {
    background: #1D4ED8; transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  }
  .btn-submit:active:not(:disabled) { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

  .btn-submit .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transform: scale(0); animation: ripple 0.55s linear;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  .spinner {
    display: none; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-submit.loading .spinner { display: block; }
  .btn-submit.loading .btn-label { opacity: 0.8; }
</style>
</head>

<body>

<div class="card-wrap">
  <div class="card">

    <div class="card-body">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>HR Contract System</h1>
          <p>Sign in to your account</p>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Django messages -->
      {% if messages %}
        {% for message in messages %}
          <div class="error-box">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                 stroke-width="1.5" style="flex-shrink:0;margin-top:1px">
              <circle cx="8" cy="8" r="6"/>
              <path d="M8 5v3M8 11h.01" stroke-linecap="round"/>
            </svg>
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" id="loginForm" onsubmit="handleSubmit(event)" novalidate>
        {% csrf_token %}

        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <input type="text" id="username" name="username"
                   placeholder="Enter your username"
                   autocomplete="username"
                   oninput="clearErr('username')" required>
            <svg class="input-icon" width="14" height="14" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.5">
              <circle cx="8" cy="5.5" r="2.5"/>
              <path d="M2.5 14c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="field-hint" id="username-err">Username is required.</span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   oninput="clearErr('password')"
                   onkeyup="checkCaps(event)" required>
            <svg class="input-icon" width="14" height="14" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="7" width="10" height="7" rx="1.5"/>
              <path d="M5 7V5a3 3 0 0 1 6 0v2" stroke-linecap="round"/>
            </svg>
            <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Toggle password">
              <svg id="eyeIcon" width="14" height="14" viewBox="0 0 16 16" fill="none"
                   stroke="currentColor" stroke-width="1.5">
                <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke-linecap="round"/>
                <circle cx="8" cy="8" r="2"/>
              </svg>
            </button>
          </div>
          <div class="capslock" id="capsWarn">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M8 2l6 6H9v6H7V8H2z" stroke-linejoin="round"/>
            </svg>
            Caps Lock is on
          </div>
          <span class="field-hint" id="password-err">Password is required.</span>
        </div>

        <div class="options-row">
          <label class="check-label">
            <input type="checkbox" name="remember" id="remember">
            <div class="custom-check"></div>
            Remember me
          </label>
        </div>

      </form>
    </div>

    <!-- Nav row — same as form steps -->
    <div class="nav-row">
      <div class="nav-info">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="7" width="10" height="7" rx="1.5"/>
          <path d="M5 7V5a3 3 0 0 1 6 0v2" stroke-linecap="round"/>
        </svg>
        Secure login
      </div>
      <button type="submit" form="loginForm" class="btn-submit" id="loginBtn">
        <div class="spinner"></div>
        <span class="btn-label">Sign in</span>
        <svg id="btnArrow" width="13" height="13" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M3 8h10M9 4l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </div>
</div>

<script>
  function togglePw() {
    const inp  = document.getElementById('password');
    const ico  = document.getElementById('eyeIcon');
    const show = inp.type === 'password';
    inp.type   = show ? 'text' : 'password';
    ico.innerHTML = show
      ? `<path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke-linecap="round"/><line x1="2" y1="2" x2="14" y2="14" stroke-linecap="round"/>`
      : `<path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke-linecap="round"/><circle cx="8" cy="8" r="2"/>`;
  }

  function checkCaps(e) {
    document.getElementById('capsWarn').classList.toggle('show',
      !!(e.getModifierState && e.getModifierState('CapsLock')));
  }

  function clearErr(f) {
    document.getElementById(f).classList.remove('err');
    document.getElementById(f + '-err').classList.remove('visible');
  }

  function setErr(f, msg) {
    const el  = document.getElementById(f);
    const err = document.getElementById(f + '-err');
    el.classList.add('err');
    err.textContent = msg;
    err.classList.add('visible');
    el.focus();
  }

  function handleSubmit(ev) {
    const u  = document.getElementById('username').value.trim();
    const p  = document.getElementById('password').value;
    let ok   = true;
    if (!u) { setErr('username', 'Username is required.'); ok = false; }
    if (!p) { setErr('password', 'Password is required.'); ok = false; }
    if (!ok) { ev.preventDefault(); return; }

    const btn  = document.getElementById('loginBtn');
    const rect = btn.getBoundingClientRect();
    const rip  = document.createElement('span');
    rip.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    rip.style.cssText = `width:${size}px;height:${size}px;left:${(ev.clientX||rect.left+rect.width/2)-rect.left-size/2}px;top:${(ev.clientY||rect.top+rect.height/2)-rect.top-size/2}px`;
    btn.appendChild(rip);
    rip.addEventListener('animationend', () => rip.remove());

    btn.classList.add('loading');
    btn.disabled = true;
    document.getElementById('btnArrow').style.display = 'none';
    document.querySelector('.btn-label').textContent = 'Signing in…';
  }
</script>

</body>
</html>
